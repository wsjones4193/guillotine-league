<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guillotine League — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500;600&display=swap">
  <script type="module" src="/src/login.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070A0B;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .login-card {
      background: #F4EEE1;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .login-brand img {
      width: 96px;
      height: 96px;
      object-fit: contain;
    }
    .login-wordmark {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      text-align: center;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    .login-wordmark .the   { font-size: 11px; letter-spacing: 0.14em; font-weight: 700; color: #6b6560; }
    .login-wordmark .name  { font-size: 22px; color: #070A0B; }
    .login-wordmark .league { font-size: 11px; letter-spacing: 0.2em; font-weight: 800; color: #B51217; }
    .login-sub { font-size: 12px; color: #9a948e; text-align: center; font-weight: 500; letter-spacing: 0.02em; }
    form { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    input {
      width: 100%;
      background: #fff;
      border: 1px solid #ddd8d0;
      border-radius: 8px;
      padding: 11px 14px;
      color: #1A1D1E;
      font-size: 14px;
      outline: none;
      font-family: 'Inter', system-ui, sans-serif;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #B51217; }
    input::placeholder { color: #b0a99f; }
    .login-btn {
      background: #B51217;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
      font-family: 'Outfit', system-ui, sans-serif;
      letter-spacing: 0.04em;
      transition: background 0.15s;
    }
    .login-btn:hover { background: #8f0d11; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg {
      color: #B51217;
      font-size: 13px;
      text-align: center;
      display: none;
      background: rgba(181,18,23,0.08);
      border: 1px solid rgba(181,18,23,0.2);
      border-radius: 8px;
      padding: 10px 14px;
      width: 100%;
    }
    .error-msg.visible { display: block; }
    .access-note { font-size: 12px; color: #9a948e; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <img src="/logo.png" alt="Guillotine League">
    </div>
    <div class="login-sub">2025 Draft Board</div>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
      <input type="email"    id="emailInput"    placeholder="Email address" required autocomplete="email">
      <input type="password" id="passwordInput" placeholder="Password"      required autocomplete="current-password">
      <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
    </form>
    <div class="access-note">Contact the commissioner to get access.</div>
  </div>
</body>
</html>
