<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guillotine League</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap">
  <script>
    window.__cloudReady = new Promise(function(resolve) { window.__cloudResolve = resolve; });
  </script>
  <script type="module" src="/src/main.js"></script>
  <link rel="stylesheet" href="/legacy/styles.css">
</head>
<body style="margin:0;padding:0;background:#F4EEE1;font-family:'Inter',system-ui,sans-serif;">

  <!-- Loading overlay -->
  <div id="loadingOverlay" style="position:fixed;inset:0;background:#070A0B;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:20px;">
    <img src="/logo.png" style="width:160px;height:160px;object-fit:contain;">
    <div style="color:#CAC4BB;font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;">Loading Draft Board…</div>
  </div>

  <!-- Top nav -->
  <nav style="background:#070A0B;height:56px;display:flex;align-items:center;padding:0 16px;gap:0;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 rgba(181,18,23,0.3);">
    <a href="/draftboard" onclick="navigate('draft');return false;" style="display:flex;align-items:center;gap:10px;margin-right:20px;text-decoration:none;flex-shrink:0;">
      <img src="/logo.png" style="height:40px;width:40px;object-fit:contain;">
      <span style="font-family:'Outfit',sans-serif;font-weight:900;font-size:17px;color:#F4EEE1;letter-spacing:-0.01em;line-height:1;">THE<br><span style="color:#B51217;font-size:14px;letter-spacing:0.06em;">GUILLOTINE</span></span>
    </a>
    <a href="/draftboard" class="g-nav-link active" onclick="navigate('draft');return false;">Draft Board</a>
    <a href="/available"  class="g-nav-link" onclick="navigate('available');return false;">Available</a>
    <a href="/teams"      class="g-nav-link" onclick="navigate('teams');return false;">Teams</a>
    <a href="/drafting"   class="g-nav-link" onclick="navigate('drafting');return false;">Pick Selector</a>
    <a href="/setup"      class="g-nav-link" data-admin style="display:none;" onclick="navigate('setup');return false;">Setup</a>
    <div style="margin-left:auto;display:flex;align-items:center;gap:16px;">
      <span style="font-size:13px;color:#a8a29e;" id="userDisplayName"></span>
      <a href="#" onclick="window.cloudSignOut()" style="font-size:13px;color:#B51217;font-weight:700;text-decoration:none;letter-spacing:0.02em;">Sign Out</a>
    </div>
  </nav>

  <!-- Pages -->
  <div id="page-draft"     class="g-page active"></div>
  <div id="page-available" class="g-page"></div>
  <div id="page-drafting"  class="g-page"></div>
  <div id="page-teams"     class="g-page"></div>
  <div id="page-setup"     class="g-page"></div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="/legacy/data.js"></script>
  <script src="/legacy/headshots.js"></script>
  <script src="/legacy/guillotine.js"></script>
</body>
</html>
